<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Search Portal</h1>
        </header>
        <main>
            <form id="searchForm">
                <label for="searchInput">Enter Receipt or Voucher Number:</label>
                <input type="text" id="searchInput" placeholder="Search..." required>
                <button type="submit">Search</button>
            </form>
            <div id="results"></div>
        </main>
        <footer>
            <p>&copy; 2026 Twinstars Group</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html> 

<script>
const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
const SUPABASE_KEY = 'your-supabase-key';

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('searchForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const searchInput = document.getElementById('searchInput').value;
    const { data, error } = await supabaseClient
        .from('your_table_name')
        .select('*')
        .or(`receipt_number.eq.${searchInput},voucher_number.eq.${searchInput}`);

    if (error) {
        console.error('Error fetching data:', error);
        document.getElementById('results').innerHTML = '<p>Error fetching results.</p>';
    } else {
        displayResults(data);
    }
});

function displayResults(data) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';
    if (data.length === 0) {
        resultsDiv.innerHTML = '<p>No results found.</p>';
    } else {
        data.forEach(result => {
            resultsDiv.innerHTML += `<div class='result-item'>
                <h2>${result.title}</h2>
                <p>${result.description}</p>
            </div>`;
        });
    }
}
</script>
