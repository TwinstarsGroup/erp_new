<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Employee TSE — Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="images/logo200.png" alt="Twinstar Group" style="height:38px;opacity:.95;" />
      <div class="sidebar-company-info" id="sidebar-company-info">
        <div class="company-name">Twinstar Group</div>
        <span class="company-detail">Bangalore, Karnataka, India</span>
        <span class="company-detail">admin@twinstarsgroup.com</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a class="nav-link" data-page="dashboard.html" href="dashboard.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <div class="nav-section-label">Finance</div>
      <a class="nav-link" data-page="receipts.html" href="receipts.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Receipts
      </a>
      <a class="nav-link" data-page="vouchers.html" href="vouchers.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Cash Vouchers
      </a>
      <div class="nav-section-label">Storage</div>
      <a class="nav-link" data-page="attachments.html" href="attachments.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Attachments
      </a>
      <div class="nav-section-label">HR</div>
      <a class="nav-link" data-page="create-employee-tse.html" href="create-employee-tse.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Create Employee TSE
      </a>
      <a class="nav-link" data-page="generate-payslip.html" href="generate-payslip.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Generate Payslip
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <img id="user-avatar" src="https://ui-avatars.com/api/?name=Admin&background=800020&color=fff" alt="User" />
        <div>
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role" id="user-email">Loading…</div>
        </div>
      </div>
      <button class="btn-logout" onclick="signOut()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Create Employee TSE</div>
      <div class="topbar-actions"></div>
    </header>

    <main class="page-body">

      <!-- Create Form -->
      <div class="card" style="margin-bottom:24px;">
        <div class="card-header">
          <div class="card-title">New Employee</div>
        </div>
        <div class="card-body">
          <form id="employee-form" onsubmit="return false;">

            <div class="form-row cols-3">
              <div class="form-group">
                <label class="form-label">Emp Name <span class="required">*</span></label>
                <input class="form-control" id="emp-name" type="text" placeholder="Full name" required />
              </div>
              <div class="form-group">
                <label class="form-label">Emp ID <span class="required">*</span></label>
                <input class="form-control" id="emp-id" type="text" placeholder="e.g. EMP-001" required />
              </div>
              <div class="form-group">
                <label class="form-label">Date of Joining <span class="required">*</span></label>
                <input class="form-control" id="date-of-joining" type="date" required />
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="form-group">
                <label class="form-label">Account Number <span class="required">*</span></label>
                <input class="form-control" id="account-number" type="text" placeholder="Bank account number" required />
              </div>
              <div class="form-group">
                <label class="form-label">Position <span class="required">*</span></label>
                <input class="form-control" id="position" type="text" placeholder="e.g. Software Engineer" required />
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="form-group">
                <label class="form-label">Company Name <span class="required">*</span></label>
                <select class="form-control" id="company-id" required>
                  <option value="">— Select Company —</option>
                  <option value="twinstar-entertainers">Twinstar Entertainers LLP</option>
                  <option value="twinstar-datalytiks">Twinstar Datalytiks LLP</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Email ID <span class="required">*</span></label>
                <input class="form-control" id="emp-email" type="email" placeholder="employee@example.com" required />
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="form-group">
                <label class="form-label">PAN Number</label>
                <input class="form-control" id="pan-number" type="text" placeholder="e.g. ABCDE1234F" />
              </div>
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
              <button type="button" class="btn btn-outline" onclick="resetEmployeeForm()">Reset</button>
              <button type="button" class="btn btn-primary" onclick="saveEmployee()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save Employee
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Employee List -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">All Employees</div>
        </div>
        <div class="card-body" style="padding:0;">
          <div id="employee-list">
            <div class="empty-state" style="padding:40px;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <h3>No employees yet</h3>
              <p>Add your first employee using the form above</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/employees.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initEmployees);
</script>
</body>
</html>
